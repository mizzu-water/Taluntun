<div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md mx-auto mt-16 mb-16">

            <!-- Icon -->
            <div class="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <svg class="w-7 h-7 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </div>

            <h1 class="text-2xl font-serif-heading font-bold text-gray-900 mb-1 text-center">Welcome Back</h1>
            <p class="text-gray-500 text-sm mb-8 text-center">Log in to view your RIASEC profile and matches.</p>

            <!-- Global Error Banner -->
            <div id="globalError" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-6 flex items-start gap-2">
                <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                <span id="globalErrorText"></span>
            </div>

            <!-- Not-Verified Banner (hidden by default) -->
            <div id="verifyBanner" class="hidden bg-orange-50 border border-orange-200 text-orange-800 text-sm rounded-lg px-4 py-3 mb-6">
                <p class="font-bold mb-1">Email not verified yet!</p>
                <p class="text-xs">Check your inbox for the verification link. 
                   <button id="resendBtn" class="underline font-bold hover:text-orange-600">Resend email</button>
                </p>
            </div>

            <form id="loginForm" novalidate class="space-y-5">
                <!-- Email -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Email Address</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email"
                           class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition text-gray-800">
                    <p class="error-msg" id="emailError"></p>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-bold text-gray-700">Password</label>
                        <a href="#" class="text-xs text-emerald-600 hover:underline font-bold">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input id="password" name="password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password"
                               class="w-full px-4 py-3 pr-12 rounded-lg bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition text-gray-800">
                        <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                    <p class="error-msg" id="passwordError"></p>
                </div>

                <!-- Submit -->
                <button type="submit" id="submitBtn"
                        class="w-full bg-[#0e3223] hover:bg-black text-white font-bold py-3.5 rounded-lg transition mt-2 flex items-center justify-center gap-2">
                    <span id="submitText">Log In</span>
                    <svg id="submitSpinner" class="hidden animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500">
                Don't have an account?
                <a href="signup" class="text-emerald-700 font-bold hover:underline">Sign up free</a>
            </div>
        </div>
<script>
    // -- Helpers ----------------------------------------------------------
    const $ = id => document.getElementById(id);

    function setError(fieldId, msg) {
        const input = $(fieldId);
        const errEl = $(fieldId + 'Error');
        if (input) { input.classList.add('input-error'); input.style.borderColor = '#ef4444'; input.style.backgroundColor = '#fef2f2'; }
        if (errEl)  { errEl.textContent = msg; errEl.classList.add('visible'); }
    }

    function clearError(fieldId) {
        const input = $(fieldId);
        const errEl = $(fieldId + 'Error');
        if (input) { input.style.borderColor = ''; input.style.backgroundColor = ''; }
        if (errEl)  { errEl.textContent = ''; errEl.classList.remove('visible'); }
    }

    function showGlobalError(msg) {
        $('globalErrorText').textContent = msg;
        $('globalError').classList.remove('hidden');
    }

    function hideGlobalError() {
        $('globalError').classList.add('hidden');
    }

    function setLoading(yes) {
        $('submitBtn').disabled = yes;
        $('submitText').textContent = yes ? 'Logging in...' : 'Log In';
        $('submitSpinner').classList.toggle('hidden', !yes);
    }

    // -- Real-time Validation ----------------------------------------------
    $('email').addEventListener('blur', () => {
        const v = $('email').value.trim();
        if (!v) { setError('email', 'Email is required.'); }
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { setError('email', 'Please enter a valid email address.'); }
        else { clearError('email'); }
    });

    $('password').addEventListener('blur', () => {
        if (!$('password').value) { setError('password', 'Password is required.'); }
        else { clearError('password'); }
    });

    // Show/hide password toggle
    $('togglePassword').addEventListener('click', () => {
        const pwd = $('password');
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
    });

    // -- Form Submit -------------------------------------------------------
    $('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideGlobalError();
        $('verifyBanner').classList.add('hidden');

        const email    = $('email').value.trim();
        const password = $('password').value;
        let valid = true;

        if (!email) { setError('email', 'Email is required.'); valid = false; }
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError('email', 'Please enter a valid email address.'); valid = false; }
        else { clearError('email'); }

        if (!password) { setError('password', 'Password is required.'); valid = false; }
        else { clearError('password'); }

        if (!valid) return;

        setLoading(true);

        try {
            const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
            const res  = await fetch('login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('talunton_user', JSON.stringify({
                    full_name: data.full_name,
                    user_type: data.user_type
                }));
                window.location.href = data.redirect || '/riasec/';
            } else {
                if (data.not_verified) {
                    $('verifyBanner').classList.remove('hidden');
                    window._unverifiedEmail = data.email;
                }
                if (data.errors) {
                    Object.entries(data.errors).forEach(([k, v]) => setError(k, v));
                } else {
                    showGlobalError(data.message || 'Login failed. Please try again.');
                }
            }
        } catch(err) {
            showGlobalError('Network error. Please check your connection and try again.');
        } finally {
            setLoading(false);
        }
    });

    ['email', 'password'].forEach(id => {
        $(id)?.addEventListener('input', () => clearError(id));
    });
</script>
