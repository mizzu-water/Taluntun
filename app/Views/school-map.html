<h1 class="text-3xl sm:text-4xl font-serif-heading font-bold text-gray-900 leading-tight mb-4">
                Location: {{ campusName }}
            </h1>
            <p class="text-gray-500 text-sm mb-8">
                Here is the map directing you to your chosen school offering {{ courseName }}.
            </p>
            
            <div class="bg-white p-2 rounded-2xl shadow-xl border border-gray-100 mb-8 overflow-hidden h-[400px]">
                <iframe 
                    width="100%" 
                    height="100%" 
                    style="border:0;" 
                    loading="lazy" 
                    allowfullscreen 
                    :src="mapUrl">
                </iframe>
            </div>
            
            <div class="flex items-center justify-center gap-4">
                <a href="results" class="text-gray-500 font-bold text-sm hover:text-gray-900 transition flex items-center gap-2">
                    &larr; Back to Results
                </a>
                <button @click="proceedToCourse" class="bg-[#0e3223] hover:bg-black text-white px-8 py-3 rounded-full font-bold text-lg transition shadow-lg flex items-center gap-2">
                    Start Course Introduction
                    &rarr;
                </button>
            </div>
