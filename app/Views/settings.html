<div class="max-w-4xl mx-auto px-4 py-8 md:py-12 w-full animate-fadeIn">
    <!-- Back to Profile Link -->
    <div class="mb-6">
        <a href="profile" class="inline-flex items-center gap-2 text-xs md:text-sm font-bold text-gray-500 hover:text-emerald-700 transition group">
            <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to My Profile
        </a>
    </div>

    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 font-serif-heading">Account Settings</h1>
        <p class="text-sm text-gray-500 mt-1">Manage your identity details, education level, and security preferences</p>
    </div>

    <div class="space-y-8">
        <!-- 1. Personal Information Form -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 md:p-10">
            <div class="border-b border-gray-100 pb-4 mb-6">
                <h2 class="text-xl font-bold text-gray-900 font-serif-heading">Personal Information</h2>
                <p class="text-xs text-gray-500 mt-0.5">Your display name and guidance profile customization</p>
            </div>

            <form id="profileInfoForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="fullNameInput" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">
                            Full Name <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" id="fullNameInput" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition text-sm font-medium" placeholder="e.g. Maria Santos">
                    </div>

                    <div>
                        <label for="emailInput" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">
                            Email Address (Read-only)
                        </label>
                        <input type="email" id="emailInput" readonly disabled class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-500 cursor-not-allowed text-sm font-medium" placeholder="loading...">
                    </div>

                    <div class="md:col-span-2">
                        <label for="userTypeSelect" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">
                            Academic Status / User Type
                        </label>
                        <select id="userTypeSelect" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition text-sm font-medium">
                            <option value="shs">Senior High School Student (G11 - G12)</option>
                            <option value="college">College Student (Undergraduate)</option>
                            <option value="graduate">College Graduate / Career Shifter</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-100 flex items-center justify-between">
                    <span id="profileStatusMsg" class="text-xs font-semibold"></span>
                    <button type="submit" id="saveProfileBtn" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-sm py-2.5 px-6 rounded-xl transition shadow-sm hover:shadow hover:-translate-y-0.5 inline-flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <span class="btn-text">Save Personal Details</span>
                        <svg class="btn-spinner hidden w-4 h-4 animate-spin text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </button>
                </div>
            </form>
        </div>

        <!-- 2. Security & Password Settings Form -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 md:p-10">
            <div class="border-b border-gray-100 pb-4 mb-6">
                <h2 class="text-xl font-bold text-gray-900 font-serif-heading">Security & Password</h2>
                <p class="text-xs text-gray-500 mt-0.5">Keep your account secure with a strong password (minimum 8 characters)</p>
            </div>

            <form id="passwordForm" class="space-y-6">
                <!-- Current Password -->
                <div>
                    <label for="currentPassword" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">
                        Current Password <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" id="currentPassword" required class="w-full px-4 py-3 pr-12 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition text-sm font-medium" placeholder="Enter current password to verify">
                        <button type="button" class="toggle-password-btn absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1" data-target="currentPassword" aria-label="Toggle password visibility">
                            <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            <svg class="eye-closed w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- New Password -->
                    <div>
                        <label for="newPassword" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">
                            New Password <span class="text-rose-500">*</span>
                        </label>
                        <div class="relative">
                            <input type="password" id="newPassword" required minlength="8" class="w-full px-4 py-3 pr-12 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition text-sm font-medium" placeholder="At least 8 characters">
                            <button type="button" class="toggle-password-btn absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1" data-target="newPassword" aria-label="Toggle password visibility">
                                <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                <svg class="eye-closed w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Confirm New Password -->
                    <div>
                        <label for="confirmPassword" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">
                            Confirm New Password <span class="text-rose-500">*</span>
                        </label>
                        <div class="relative">
                            <input type="password" id="confirmPassword" required minlength="8" class="w-full px-4 py-3 pr-12 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition text-sm font-medium" placeholder="Re-enter new password">
                            <button type="button" class="toggle-password-btn absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1" data-target="confirmPassword" aria-label="Toggle password visibility">
                                <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                <svg class="eye-closed w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-100 flex items-center justify-between">
                    <span id="passwordStatusMsg" class="text-xs font-semibold"></span>
                    <button type="submit" id="updatePasswordBtn" class="bg-gray-900 hover:bg-black text-white font-bold text-sm py-2.5 px-6 rounded-xl transition shadow-sm hover:shadow hover:-translate-y-0.5 inline-flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <span class="btn-text">Update Password</span>
                        <svg class="btn-spinner hidden w-4 h-4 animate-spin text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Password Visibility Toggles
    document.querySelectorAll('.toggle-password-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const targetId = btn.getAttribute('data-target');
            const input = document.getElementById(targetId);
            const eyeOpen = btn.querySelector('.eye-open');
            const eyeClosed = btn.querySelector('.eye-closed');
            if (input) {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                if (eyeOpen && eyeClosed) {
                    eyeOpen.classList.toggle('hidden', isPassword);
                    eyeClosed.classList.toggle('hidden', !isPassword);
                }
            }
        });
    });

    // 2. Preload Profile Data
    preloadProfileData();

    // 3. Profile Info Form Submission
    const profileForm = document.getElementById('profileInfoForm');
    profileForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('fullNameInput').value.trim();
        const userType = document.getElementById('userTypeSelect').value;
        const btn = document.getElementById('saveProfileBtn');
        const statusMsg = document.getElementById('profileStatusMsg');
        if (btn.disabled) return;

        if (!fullName) {
            statusMsg.textContent = 'Please enter your full name.';
            statusMsg.className = 'text-xs font-semibold text-rose-600';
            return;
        }

        setBtnLoading(btn, true);
        statusMsg.textContent = '';

        try {
            const csrfMeta = document.querySelector('meta[name="csrf-token"]');
            const res = await fetch('api/update_settings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrfMeta ? csrfMeta.content : ''
                },
                body: JSON.stringify({
                    full_name: fullName,
                    user_type: userType
                })
            });

            const data = await res.json();
            if (data.success) {
                statusMsg.textContent = 'Personal details updated successfully!';
                statusMsg.className = 'text-xs font-semibold text-emerald-600';
                if (window.showToast) {
                    window.showToast('Profile details updated successfully! ✨', 'success');
                }

                // Update localStorage and header if present
                const stored = localStorage.getItem('talunton_user');
                let userObj = stored ? JSON.parse(stored) : {};
                userObj.full_name = fullName;
                userObj.user_type = userType;
                localStorage.setItem('talunton_user', JSON.stringify(userObj));

                const nameDisp = document.getElementById('userNameDisplay');
                if (nameDisp) nameDisp.textContent = fullName.split(' ')[0];
            } else {
                statusMsg.textContent = data.error || 'Failed to update details.';
                statusMsg.className = 'text-xs font-semibold text-rose-600';
                if (window.showToast) {
                    window.showToast(data.error || 'Update failed', 'error');
                }
            }
        } catch (err) {
            console.error(err);
            statusMsg.textContent = 'Network error while updating details.';
            statusMsg.className = 'text-xs font-semibold text-rose-600';
            if (window.showToast) window.showToast('Network error', 'error');
        } finally {
            setBtnLoading(btn, false);
        }
    });

    // 4. Password Form Submission
    const passwordForm = document.getElementById('passwordForm');
    passwordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('updatePasswordBtn');
        const statusMsg = document.getElementById('passwordStatusMsg');
        if (btn.disabled) return;

        if (!currentPassword) {
            statusMsg.textContent = 'Current password is required.';
            statusMsg.className = 'text-xs font-semibold text-rose-600';
            return;
        }

        if (newPassword.length < 8) {
            statusMsg.textContent = 'New password must be at least 8 characters long.';
            statusMsg.className = 'text-xs font-semibold text-rose-600';
            return;
        }

        if (newPassword !== confirmPassword) {
            statusMsg.textContent = 'New password and confirmation do not match.';
            statusMsg.className = 'text-xs font-semibold text-rose-600';
            return;
        }

        setBtnLoading(btn, true);
        statusMsg.textContent = '';

        try {
            const csrfMeta = document.querySelector('meta[name="csrf-token"]');
            const res = await fetch('api/update_settings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrfMeta ? csrfMeta.content : ''
                },
                body: JSON.stringify({
                    current_password: currentPassword,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                })
            });

            const data = await res.json();
            if (data.success) {
                statusMsg.textContent = 'Password changed successfully!';
                statusMsg.className = 'text-xs font-semibold text-emerald-600';
                if (window.showToast) {
                    window.showToast('Security credentials updated! 🔒', 'success');
                }
                passwordForm.reset();
            } else {
                statusMsg.textContent = data.error || 'Failed to update password.';
                statusMsg.className = 'text-xs font-semibold text-rose-600';
                if (window.showToast) {
                    window.showToast(data.error || 'Failed to update password', 'error');
                }
            }
        } catch (err) {
            console.error(err);
            statusMsg.textContent = 'Network error while updating password.';
            statusMsg.className = 'text-xs font-semibold text-rose-600';
            if (window.showToast) window.showToast('Network error', 'error');
        } finally {
            setBtnLoading(btn, false);
        }
    });
});

async function preloadProfileData() {
    try {
        const res = await fetch('api/get_profile_data');
        if (!res.ok) return;
        const data = await res.json();
        if (data.success && data.user) {
            document.getElementById('fullNameInput').value = data.user.full_name || '';
            document.getElementById('emailInput').value = data.user.email || '';
            if (data.user.user_type) {
                document.getElementById('userTypeSelect').value = data.user.user_type;
            }
        }
    } catch (e) {
        // Fallback to localStorage
        const stored = localStorage.getItem('talunton_user');
        if (stored) {
            try {
                const u = JSON.parse(stored);
                if (u.full_name) document.getElementById('fullNameInput').value = u.full_name;
                if (u.email) document.getElementById('emailInput').value = u.email;
                if (u.user_type) document.getElementById('userTypeSelect').value = u.user_type;
            } catch (err) {}
        }
    }
}

function setBtnLoading(btn, isLoading) {
    if (!btn) return;
    btn.disabled = isLoading;
    const text = btn.querySelector('.btn-text');
    const spinner = btn.querySelector('.btn-spinner');
    if (text && spinner) {
        if (isLoading) {
            spinner.classList.remove('hidden');
        } else {
            spinner.classList.add('hidden');
        }
    }
}
</script>
