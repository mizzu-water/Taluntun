<h1 class="text-3xl font-bold text-gray-900 font-serif-heading mb-8">Account Settings</h1>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <h2 class="text-lg font-bold text-gray-900 border-b border-gray-100 pb-3 mb-6">Security Settings</h2>
            
            <form id="settingsForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Current Password</label>
                    <input type="password" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" placeholder="Enter current password">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">New Password</label>
                    <input type="password" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" placeholder="Enter new password">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Confirm New Password</label>
                    <input type="password" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" placeholder="Confirm new password">
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <button type="button" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2.5 px-6 rounded-lg transition" onclick="alert('Settings update functionality would be connected to a backend endpoint here.')">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
